name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Use JDK 25 for Gradle and expose both toolchains
        run: |
          echo "JAVA_HOME=$JAVA_HOME_25_X64" >> "$GITHUB_ENV"
          echo "GRADLE_OPTS=-Dorg.gradle.java.installations.paths=$JAVA_HOME_25_X64,$JAVA_HOME_21_X64" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Verify merged jar structure
        run: python3 scripts/verify-artifacts.py

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: lattice-jars
          path: build/dist/*.jar
