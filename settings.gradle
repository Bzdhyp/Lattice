pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'Lattice'

include ':versions'
include ':versions:fabric'
include ':versions:neoforge'
include ':versions:fabric:v1_21_11'
include ':versions:fabric:v26_3'
include ':versions:neoforge:v1_21_11'
include ':versions:neoforge:v26_3'
include ':release'
include ':render-test'

project(':versions').projectDir = file('versions')
project(':versions:fabric').projectDir = file('versions/fabric')
project(':versions:neoforge').projectDir = file('versions/neoforge')
project(':versions:fabric:v1_21_11').projectDir = file('versions/fabric/1.21.11')
project(':versions:fabric:v26_3').projectDir = file('versions/fabric/26.3')
project(':versions:neoforge:v1_21_11').projectDir = file('versions/neoforge/1.21.11')
project(':versions:neoforge:v26_3').projectDir = file('versions/neoforge/26.3')
