pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'Lattice'

include ':v1_21_11'
include ':v1_21_11:fabric'
include ':v1_21_11:neoforge'
include ':v26_3'
include ':v26_3:fabric'
include ':v26_3:neoforge'
include ':crossversion'

project(':v1_21_11').projectDir = file('versions/1.21.11')
project(':v1_21_11:fabric').projectDir = file('versions/1.21.11/fabric')
project(':v1_21_11:neoforge').projectDir = file('versions/1.21.11/neoforge')
project(':v26_3').projectDir = file('versions/26.3')
project(':v26_3:fabric').projectDir = file('versions/26.3/fabric')
project(':v26_3:neoforge').projectDir = file('versions/26.3/neoforge')
