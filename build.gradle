plugins {
    id 'base'
}

allprojects {
    group = 'dev.lattice'
    version = rootProject.findProperty('mod_version') ?: '0.1.0'

    repositories {
        mavenCentral()
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
    }
}

subprojects {
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

tasks.named('build') {
    // The only release artifact is the cross-version/cross-loader jar.
    dependsOn ':crossversion:crossVersionJar'
}
