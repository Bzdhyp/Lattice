plugins {
    id 'base'
}

allprojects {
    group = 'dev.lattice'
    version = rootProject.findProperty('mod_version') ?: '0.1.0'

    repositories {
        mavenCentral()
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
    }
}

subprojects {
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

tasks.named('build') {
    // The only release artifact is the cross-version/cross-loader jar.
    dependsOn ':release:singleUniversalJar'
    dependsOn ':render-test:test'
}

// Convenience launchers for the IntelliJ Gradle tool window.
tasks.register('runClientFabric12111') {
    group = 'run'
    description = 'Run the Minecraft 1.21.11 Fabric development client'
    dependsOn ':versions:fabric:v1_21_11:runClient'
}

tasks.register('runClientNeoForge12111') {
    group = 'run'
    description = 'Run the Minecraft 1.21.11 NeoForge development client'
    dependsOn ':versions:neoforge:v1_21_11:runClient'
}

tasks.register('runClientFabric263') {
    group = 'run'
    description = 'Run the Minecraft 26.3 Fabric development client'
    dependsOn ':versions:fabric:v26_3:runClient'
}

tasks.register('runClientNeoForge263') {
    group = 'run'
    description = 'Run the Minecraft 26.3 NeoForge development client'
    dependsOn ':versions:neoforge:v26_3:runClient'
}
