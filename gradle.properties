# Lattice build configuration
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.configuration-cache=false

# Toolchains are auto-detected locally. CI exports JAVA_HOME_21_X64 and
# JAVA_HOME_25_X64 (actions/setup-java) so the same build stays portable.
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true
org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64

mod_id=lattice
mod_name=Lattice
mod_version=0.1.0
mod_author=bzdhyp
mod_description=Lattice - a multiloader and multiversion Minecraft mod.
mod_license=MIT

# Minecraft 1.21.11 (obfuscated, Java 21)
mc_1_21_11=1.21.11
java_1_21_11=21
minecraft_range_1_21_11=[1.21.11,1.21.12)
fabric_mc_range_1_21_11=>=1.21.11 <1.21.12
fabric_loader_1_21_11=0.20.1
fabric_api_1_21_11=0.141.6+1.21.11
neoforge_1_21_11=21.11.48
neoforge_range_1_21_11=[21.11,21.12)

# Minecraft 26.3 (non-obfuscated, Java 25)
mc_26_3=26.3
java_26_3=25
minecraft_range_26_3=[26.3,26.4)
fabric_mc_range_26_3=>=26.3 <26.4
fabric_loader_26_3=0.20.1
fabric_api_26_3=0.165.0+26.3
neoforge_26_3=26.3.0.100
neoforge_range_26_3=[26.3,26.4)
