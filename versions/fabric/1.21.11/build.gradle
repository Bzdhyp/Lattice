plugins {
    id 'java'
    id 'net.fabricmc.fabric-loom-remap' version '1.18.1'
}

def mcVersion = rootProject.property('mc_1_21_11')
def javaVersion = rootProject.property('java_1_21_11')
def loaderVersion = rootProject.property('fabric_loader_1_21_11')

group = rootProject.group
version = rootProject.version

base {
    archivesName = "lattice-fabric-${mcVersion}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion.toString())
    }
}

sourceSets {
    main {
        java {
            srcDir rootProject.file('common/src/main/java')
            srcDir rootProject.file('bootstrap/fabric/src/main/java')
            srcDir rootProject.file('versions/common/1.21.11/src/main/java')
        }
        resources {
            srcDir rootProject.file('common/src/main/resources')
            srcDir rootProject.file('versions/common/1.21.11/src/main/resources')
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loaderVersion}"
    implementation 'io.github.humbleui:skija-shared:0.143.17'
    implementation 'io.github.humbleui:types:0.2.0'
    runtimeOnly 'io.github.humbleui:skija-windows-x64:0.143.17'
    compileOnly 'org.slf4j:slf4j-api:2.0.9'
}

loom {
    runs {
        client {
            client()
            ideConfigGenerated(true)
            runDir('run')
        }
        server {
            server()
            ideConfigGenerated(true)
            runDir('run')
        }
    }
}

def generateFabricApplicationRun = tasks.register(
        'generateFabricApplicationRun', dev.lattice.gradle.GenerateIdeaApplicationRunTask) {
    group = 'ide'
    description = 'Generates the Fabric Application run configuration for IntelliJ sync'
    def launchCfg = rootProject.file(
            ".gradle/loom-cache/projects/${project.path.substring(1).replace(':', '/')}/launch.cfg")
    configName.set("fabric - Client ${mcVersion}")
    moduleName.set("${rootProject.name}.${project.path.substring(1).replace(':', '.')}.main")
    mainClass.set('net.fabricmc.devlaunchinjector.Main')
    vmParameters.set("-Dfabric.dli.config=${launchCfg.absolutePath.replace('\\', '/')} " +
            "-Dfabric.dli.env=client " +
            "-Dfabric.dli.main=net.fabricmc.loader.impl.launch.knot.KnotClient " +
            "--enable-native-access=ALL-UNNAMED")
    workingDirectory.set('$PROJECT_DIR$/versions/fabric/' + mcVersion + '/run')
    outputFile.set(rootProject.layout.projectDirectory.file(
            ".idea/runConfigurations/fabric - Client ${mcVersion}.xml"))
}

tasks.matching { it.name == 'ideaSyncTask' }.configureEach {
    dependsOn generateFabricApplicationRun
}

processResources {
    def expandProps = [
            version      : project.version,
            mcVersion    : mcVersion,
            loaderVersion: loaderVersion,
            javaVersion  : javaVersion,
            modId        : rootProject.property('mod_id'),
            modName      : rootProject.property('mod_name'),
            description  : rootProject.property('mod_description'),
            author       : rootProject.property('mod_author'),
            license      : rootProject.property('mod_license'),
            mcRange      : rootProject.property('fabric_mc_range_1_21_11')
    ]
    inputs.properties(expandProps)
    filesMatching('fabric.mod.json') {
        expand(expandProps)
    }
}

tasks.withType(Jar).configureEach {
    manifest {
        attributes(
                'Specification-Title': rootProject.property('mod_name'),
                'Specification-Vendor': rootProject.property('mod_author'),
                'Specification-Version': project.version,
                'Implementation-Title': 'lattice-fabric',
                'Implementation-Version': project.version,
                'Built-On-Minecraft': mcVersion
        )
    }
}
