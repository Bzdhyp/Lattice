plugins {
    id 'base'
}

def mcVersion = rootProject.property('mc_26_3')

evaluationDependsOn(':v26_3:fabric')
evaluationDependsOn(':v26_3:neoforge')

def fabricJarTask = project(':v26_3:fabric').tasks.named('jar', Jar)
def neoForgeJarTask = project(':v26_3:neoforge').tasks.named('jar', Jar)

tasks.register('universalJar', Jar) {
    description = 'Merges the Fabric and NeoForge 26.3 jars into one universal jar.'
    group = 'build'
    dependsOn fabricJarTask, neoForgeJarTask
    archiveFileName = "lattice-${mcVersion}-${project.version}-universal.jar"
    destinationDirectory = rootProject.layout.buildDirectory.dir("intermediate/${mcVersion}")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    from { zipTree(fabricJarTask.get().archiveFile.get().asFile) }
    from { zipTree(neoForgeJarTask.get().archiveFile.get().asFile) }

    manifest {
        attributes(
                'Specification-Title': rootProject.property('mod_name'),
                'Specification-Vendor': rootProject.property('mod_author'),
                'Specification-Version': project.version,
                'Implementation-Title': 'lattice-universal',
                'Implementation-Version': project.version,
                'Built-On-Minecraft': mcVersion
        )
    }
}
