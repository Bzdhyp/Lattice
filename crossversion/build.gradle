plugins {
    id 'base'
}

evaluationDependsOn(':v1_21_11')
evaluationDependsOn(':v26_3')

def jar12111 = project(':v1_21_11').tasks.named('universalJar', Jar)
def jar263 = project(':v26_3').tasks.named('universalJar', Jar)

def expandProps = [
        version         : project.version,
        modId           : rootProject.property('mod_id'),
        modName         : rootProject.property('mod_name'),
        description     : rootProject.property('mod_description'),
        author          : rootProject.property('mod_author'),
        license         : rootProject.property('mod_license'),
        fabricMcRange   : '>=1.21.11 <26.4',
        neoforgeMcRange : '[1.21.11,26.4)',
        neoforgeRange   : '[21.11,27)',
        fabricLoader    : rootProject.property('fabric_loader_1_21_11')
]

def generatedResources = tasks.register('generateCrossVersionResources', Copy) {
    from 'src/main/resources'
    into layout.buildDirectory.dir('generated/resources')
    inputs.properties(expandProps)
    expand(expandProps)
}

tasks.register('crossVersionJar', Jar) {
    description = 'Builds the experimental one-jar PoC for 1.21.11 + 26.3 on Fabric/NeoForge.'
    group = 'build'
    dependsOn jar12111, jar263, generatedResources
    archiveFileName = "lattice-${project.version}-universal.jar"
    destinationDirectory = rootProject.layout.buildDirectory.dir('dist')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'

    from({ zipTree(jar12111.get().archiveFile.get().asFile) }) {
        exclude 'fabric.mod.json'
        exclude 'META-INF/neoforge.mods.toml'
        exclude 'META-INF/MANIFEST.MF'
    }
    from({ zipTree(jar263.get().archiveFile.get().asFile) }) {
        exclude 'fabric.mod.json'
        exclude 'META-INF/neoforge.mods.toml'
        exclude 'META-INF/MANIFEST.MF'
    }
    from generatedResources

    manifest {
        attributes(
                'Specification-Title': rootProject.property('mod_name'),
                'Specification-Vendor': rootProject.property('mod_author'),
                'Specification-Version': project.version,
                'Implementation-Title': 'lattice-crossversion-universal',
                'Implementation-Version': project.version,
                'Built-On-Minecraft': '1.21.11,26.3'
        )
    }
}
